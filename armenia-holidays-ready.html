<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armenia Holidays — Atlas of Armenia: Garni, Geghard & every region</title>
<meta name="description" content="Discover Armenia: Garni Temple, Geghard, Lake Sevan, Khor Virap, Tatev and more. Smart travel search for visas, transfers, tours, car rental and trip planning.">
<!-- CONCEPT: keep noindex while this is a proposal. On the company's own domain change to: index, follow -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16356b">
<meta property="og:type" content="website">
<meta property="og:title" content="Armenia Holidays — Discover Garni & the best of Armenia">
<meta property="og:description" content="Beautiful places, instant answers and easy trip planning for Armenia.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316356b'/%3E%3Cpath d='M8 50 24 22l8 13 7-10 17 25z' fill='%23fff'/%3E%3Ccircle cx='46' cy='17' r='5' fill='%23e8892b'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf7f0; --bg2:#f3ead9; --card:#fff; --ink:#182234; --muted:#5d6678; --line:#e5dccb;
  --primary:#16356b; --primary-ink:#fff; --accent:#e8892b; --accent-soft:#fdebd3; --accent-ink:#8a4300;
  --ok:#2e7d4f; --red:#c9302c; --shadow:0 1px 2px rgba(22,53,107,.06),0 12px 32px rgba(22,53,107,.10);
  --radius:20px; --serif:Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0e1524; --bg2:#151f33; --card:#182338; --ink:#edf1f8; --muted:#a4aec4; --line:#28344d;
  --primary:#9db8f2; --primary-ink:#0e1524; --accent:#f2a24b; --accent-soft:#3a2c1b; --accent-ink:#ffc684;
  --ok:#6fd29a; --red:#ff7b72; --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--primary)}
button{font:inherit;color:inherit;cursor:pointer}
svg{max-width:100%}
section[id]{scroll-margin-top:76px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:10px;z-index:300;background:var(--primary);color:var(--primary-ink);padding:10px 16px;border-radius:10px}
.skip:focus{left:12px}
.wrap{max-width:1180px;margin:auto;padding:0 20px}
.concept{background:#fff3cd;color:#5c4400;font-size:13px;text-align:center;padding:8px 44px;border-bottom:1px solid #f1dc97;position:relative}
:root[data-theme="dark"] .concept{background:#3a2f0b;color:#f5df9c;border-color:#5a4a15}
.concept button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;line-height:1}

/* header */
.top{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:10px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--serif);font-size:20px;font-weight:700;white-space:nowrap}
.brand b{color:var(--accent)}
.logo{width:34px;height:34px}
.spacer{flex:1}
.nav{display:flex;gap:2px;margin-left:14px}
.nav a{text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:10px;font-size:14.5px;font-weight:600}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa3b5}
.pill.open .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.icon-btn{border:1px solid var(--line);background:var(--card);height:40px;min-width:40px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.icon-btn:hover{border-color:var(--accent)}
.badge{background:var(--accent);color:#1b1206;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.badge[hidden]{display:none}

/* hero */
.hero{position:relative;color:#fff;background:linear-gradient(170deg,#0f2550 0%,#1d4287 52%,#e8892b 160%)}
.hero .sky{position:absolute;inset:0;overflow:hidden}
.hero .sky svg{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:auto}
.sun{position:absolute;right:12%;top:70px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ffd89a 0%,rgba(255,196,120,.45) 45%,transparent 70%);filter:blur(2px)}
.hero-inner{position:relative;padding-top:64px;padding-bottom:150px;text-align:center}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.15em;text-transform:uppercase;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);padding:7px 14px;border-radius:999px}
h1{font-family:var(--serif);font-size:clamp(34px,5.6vw,62px);line-height:1.06;margin:20px auto 14px;max-width:860px}
h1 em{font-style:normal;color:#ffc27a}
.lead{font-size:18px;max-width:640px;margin:0 auto 28px;color:#e3eafa}
.search{position:relative;max-width:740px;margin:auto;text-align:left;z-index:30}
.search input{width:100%;height:66px;border:0;border-radius:20px;padding:0 120px 0 56px;font-size:17px;background:#fff;color:#182234;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.search input::placeholder{color:#7a8296}
.search .ic{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#6b7487;pointer-events:none}
.search .right{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:center}
.kbd{font:600 12px var(--sans);border:1px solid #d6dbe6;border-bottom-width:2px;border-radius:7px;padding:3px 8px;color:#69738a;background:#f5f7fb}
.clear{border:0;background:#eef1f7;color:#44506a;width:36px;height:36px;border-radius:10px;display:none}
.search.has .clear{display:block}
.search.has .kbd{display:none}
.panel{position:absolute;left:0;right:0;top:74px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 26px 60px rgba(0,0,0,.32);padding:8px;max-height:min(62vh,520px);overflow:auto}
.panel[hidden]{display:none}
.grp{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:700}
.opt{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer}
.opt[aria-selected="true"],.opt:hover{background:var(--accent-soft)}
.opt .oi{width:38px;height:38px;border-radius:11px;background:var(--bg2);display:grid;place-items:center;flex:none;font-size:18px}
.opt .ot{flex:1;min-width:0}
.opt b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .tg{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;flex:none}
.pfoot{display:flex;justify-content:space-between;gap:10px;padding:9px 12px 4px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:6px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:6px}
mark{background:#ffe08a;color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] mark{background:#6b5314;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
.chip{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#fff;padding:8px 15px;border-radius:999px;font-size:14px}
.chip:hover{background:rgba(255,255,255,.26)}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:var(--primary-ink);border:0;border-radius:13px;padding:13px 22px;font-weight:700;text-decoration:none;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);color:#1b1206}
.btn.light{background:#fff;color:#16356b}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.small{padding:9px 15px;font-size:14px}

.trust{margin-top:-96px;position:relative;z-index:5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:30px;color:var(--primary);line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

/* sections */
.sec{padding-top:74px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-family:var(--serif);font-size:clamp(28px,3.6vw,40px);line-height:1.12;margin:6px 0 0}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:800}
.sub{color:var(--muted);max-width:560px;margin:8px 0 0}

/* art */
.art{position:relative;overflow:hidden;background:var(--bg2)}
.art svg,.art img{display:block;width:100%;height:100%;object-fit:cover}

/* Garni */
.garni{margin-top:74px;background:linear-gradient(180deg,#0f2550 0%,#16356b 60%,#1b3f80 100%);color:#fff;position:relative;overflow:hidden}
:root[data-theme="dark"] .garni{background:linear-gradient(180deg,#0a1226,#101c38)}
.garni .wrap{position:relative}
.g-top{display:grid;grid-template-columns:1.02fr 1fr;gap:44px;align-items:center;padding:70px 0 40px}
.g-top h2{font-family:var(--serif);font-size:clamp(32px,4.4vw,52px);line-height:1.07;margin:14px 0}
.g-top .lead{margin:0 0 22px;text-align:left;color:#dbe5fa}
.tagline{display:inline-block;background:var(--accent);color:#1b1206;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 13px;border-radius:999px}
.g-art{border-radius:28px;aspect-ratio:4/3.2;box-shadow:0 30px 70px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2)}
.g-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.g-facts div{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);border-radius:16px;padding:12px 10px;text-align:center}
.g-facts b{display:block;font-family:var(--serif);font-size:22px;color:#ffc27a}
.g-facts span{font-size:12px;color:#cfdaf3;line-height:1.3;display:block}
.g-btns{display:flex;gap:10px;flex-wrap:wrap}
.g-tabs{display:flex;gap:8px;overflow:auto;margin-top:10px;padding-bottom:4px}
.g-tab{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;white-space:nowrap}
.g-tab[aria-selected="true"]{background:#fff;color:#16356b;border-color:#fff}
.g-panel{display:grid;grid-template-columns:1fr 1.1fr;gap:30px;align-items:center;margin-top:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:26px;padding:20px}
.g-panel .art{border-radius:18px;aspect-ratio:4/2.9}
.g-panel h3{font-family:var(--serif);font-size:27px;margin:0 0 8px}
.g-panel p{margin:0 0 12px;color:#dbe5fa}
.g-panel ul{margin:0;padding-left:20px;color:#e9effc}
.g-panel li{margin:4px 0}
.day{margin:40px 0 0;padding-bottom:72px}
.day h3{font-family:var(--serif);font-size:26px;margin:0 0 4px}
.day .small{color:#cfdaf3;font-size:14px;margin:0 0 20px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;counter-reset:s}
.steps li{list-style:none;position:relative;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 12px 14px}
.steps b{display:block;color:#ffc27a;font-size:13px;letter-spacing:.05em}
.steps span{font-size:14px;line-height:1.35;display:block;margin-top:4px;color:#eef3fe}
.steps{margin:0;padding:0}

/* explore */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.f{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:650;font-size:14px}
.f[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;transition:transform .18s,border-color .18s;text-align:left;padding:0}
.pc:hover{transform:translateY(-3px);border-color:var(--accent)}
.pc .art{aspect-ratio:4/3}
.pc .must{position:absolute;left:12px;top:12px;background:var(--accent);color:#1b1206;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;z-index:2}
.pc .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.pc h3{margin:0;font-family:var(--serif);font-size:19px;line-height:1.2}
.pc .meta{color:var(--muted);font-size:13px}
.pc p{margin:2px 0 8px;font-size:14px;color:var(--muted);flex:1}
.addbtn{align-self:flex-start;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700}
.addbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.addbtn:hover{border-color:var(--accent)}

/* atlas */
.afilters{display:grid;gap:10px;margin-bottom:14px}
.f small{opacity:.65;font-weight:600;margin-left:2px}
#map{height:540px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);background:var(--bg2);overflow:hidden;position:relative;z-index:1}
#map.nomap{display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.leaflet-container{font:inherit}
.pinw{background:none;border:0}
.pin{display:block;width:16px;height:16px;margin:3px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.pin.town{background:#16356b}
.pin.village{background:#2e9d5f}
.pin.site{background:#e8892b}
.pin.feat{width:22px;height:22px;margin:0;background:#d6452a;border-width:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 2px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.rbanner{margin:18px 0 14px;padding:14px 18px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:transform .18s,border-color .18s;box-shadow:var(--shadow)}
.ac:hover{transform:translateY(-2px);border-color:var(--accent)}
.ac h3{margin:4px 0 0;font-family:var(--serif);font-size:19px;line-height:1.2}
.ac .loc{color:var(--muted);font-size:13px}
.ac p{margin:4px 0 8px;font-size:14px;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ah{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ty{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg2);color:var(--primary)}
.ty.village{background:color-mix(in srgb,#2e9d5f 18%,transparent);color:var(--ok)}
.ty.site{background:var(--accent-soft);color:var(--accent-ink)}
.star{font-size:11px;font-weight:800;color:#d6452a;letter-spacing:.05em}
@media(max-width:1020px){.agrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.agrid{grid-template-columns:1fr}#map{height:420px}}

/* help */
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:84px;display:grid;gap:14px}
.side{grid-template-columns:minmax(0,1fr)}
.layout>*,.g-top>*,.g-panel>*,.contact-grid>*{min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.box h3{margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.topics{display:grid;gap:2px}
.topic{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:11px}
.topic:hover{background:var(--bg2)}
.topic[aria-pressed="true"]{background:var(--accent-soft);font-weight:700}
.topic .n{font-size:12px;color:var(--muted);background:var(--bg2);border-radius:999px;padding:2px 9px}
.mini{display:grid;gap:4px}
.mini button{border:0;background:none;text-align:left;padding:7px 9px;border-radius:9px;color:var(--primary);font-size:14px}
.mini button:hover{background:var(--bg2)}
.hours{display:grid;gap:5px;font-size:14px}
.hours div{display:flex;justify-content:space-between}
.hours span{color:var(--muted)}
.ffilter{position:relative;margin-bottom:12px}
.ffilter input{padding-left:42px}
.ffilter svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.head h3{margin:0;font-family:var(--serif);font-size:24px}
.count{color:var(--muted);font-size:14px}
.faq{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s}
.item.target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.q{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;border:0;background:none;padding:16px 18px;font-weight:650;font-size:16.5px}
.q .tag{flex:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);background:var(--bg2);border-radius:999px;padding:3px 10px;margin-top:3px;font-weight:700}
.q .t{flex:1}
.q .chev{flex:none;transition:.2s;color:var(--muted);margin-top:3px}
.item.open .chev{transform:rotate(180deg)}
.a{padding:0 18px 18px}
.a p{margin:0 0 12px}
.meta2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.meta2 button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 13px;font-size:13px}
.meta2 button:hover{border-color:var(--accent)}
.meta2 button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.noresult{text-align:center;padding:40px 22px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}
.noresult h3{font-family:var(--serif);margin:0 0 8px}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 24px;font-weight:650}
.more:hover{border-color:var(--accent)}
.mplaces{display:flex;gap:10px;overflow:auto;margin-bottom:14px;padding-bottom:4px}
.mplaces:empty{display:none}
.mp{flex:none;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:8px 14px 8px 8px;font-weight:650}
.mp .art{width:46px;height:46px;border-radius:10px}

/* forms */
.formcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.formcard h3{font-family:var(--serif);font-size:26px;margin:0 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{display:block;font-weight:650;font-size:14px;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:12px;font:inherit}
textarea{min-height:120px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin:17px 0}
legend{font-weight:650;font-size:14px;padding:0 7px}
.checks{display:flex;flex-wrap:wrap;gap:9px}
.checks label{display:inline-flex;align-items:center;gap:7px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:7px 13px;margin:0;cursor:pointer}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.checks input{width:auto}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:5px}
.success{display:none;margin-top:17px;background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid var(--ok);border-radius:13px;padding:15px}
.success.on{display:block}
.row{display:flex;gap:11px;flex-wrap:wrap;margin-top:19px}
.trip{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0}
.tchip{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:5px 6px 5px 13px;font-weight:650;font-size:14px}
.tchip button{border:0;background:var(--card);border-radius:50%;width:24px;height:24px;line-height:1}
.hint{color:var(--muted);font-size:14px}
.contact-grid{display:grid;grid-template-columns:1fr 1.35fr;gap:22px;align-items:start}
.contact-list{display:grid;gap:12px}
.contact-list .box b{display:block}
.value{color:var(--muted)}
.value a{color:var(--primary)}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:74px}
.why div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.why h3{font-family:var(--serif);margin:0 0 6px}
.why p{margin:0;color:var(--muted)}

/* dialog */
dialog{border:0;padding:0;border-radius:26px;width:min(860px,94vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 40px 100px rgba(0,0,0,.5);overflow:auto}
dialog::backdrop{background:rgba(8,14,28,.62);backdrop-filter:blur(3px)}
.d-art{aspect-ratio:16/8.6}
.d-body{padding:22px 26px 28px}
.d-x{position:absolute;right:14px;top:14px;z-index:3;background:rgba(255,255,255,.92);color:#182234;border:0;width:40px;height:40px;border-radius:50%;font-size:20px}
.d-body h2{font-family:var(--serif);font-size:32px;line-height:1.1;margin:4px 0 6px}
.d-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.d-facts div{background:var(--bg2);border-radius:14px;padding:10px 12px}
.d-facts small{display:block;color:var(--muted);font-size:12px}
.d-facts b{font-size:14.5px}
.d-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.d-cols h4{margin:0 0 6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.d-cols ul{margin:0;padding-left:20px}
.related{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.related button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px;text-align:left}
.related button:hover{border-color:var(--accent)}

footer{background:var(--primary);color:#e9eefb;padding:46px 0 26px;margin-top:80px}
:root[data-theme="dark"] footer{background:#0a101c}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:26px}
footer h4{margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#bcc8e6}
footer a{color:#e9eefb;display:block;padding:3px 0;text-decoration:none}
footer a:hover{text-decoration:underline}
footer small{display:block;margin-top:24px;color:#aab7d8}
.sales{margin-top:24px;padding:18px;border:1px solid rgba(255,255,255,.25);border-radius:16px}
.toast{position:fixed;right:18px;bottom:18px;z-index:400;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 17px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}

@media(max-width:1020px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
  .nav,.pill{display:none}
  .g-top,.g-panel,.contact-grid,.layout,.why,footer .cols,.grid2,.d-cols{grid-template-columns:1fr}
  .side{position:static}
  .topics{display:flex;overflow:auto;gap:7px;padding-bottom:5px}
  .topic{white-space:nowrap;border:1px solid var(--line)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .g-art{order:-1}
  .d-facts{grid-template-columns:repeat(2,1fr)}
  .hero-inner{padding-top:48px;padding-bottom:130px}
  .sun{width:90px;height:90px;right:6%}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
  .g-facts{grid-template-columns:repeat(2,1fr)}
  .search input{height:58px;padding-right:56px;font-size:16px}
  .kbd{display:none}
  .formcard{padding:20px}
  .brand span{font-size:18px}
}
@media print{
  .top,.hero,.concept,.toast,footer,.panel{display:none!important}
  body{background:#fff;color:#000}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ===== v3: languages + spotlight ===== */
:root{--serif:Georgia,"Noto Serif Armenian","Sylfaen","Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans Armenian","Sylfaen",Roboto,Helvetica,Arial,sans-serif}
.lang{display:inline-flex;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:3px;gap:2px;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:700 12.5px var(--sans);padding:0 9px;height:32px;min-width:34px;border-radius:9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.lang button:hover{color:var(--ink)}.lang button[aria-pressed="true"]:hover{color:var(--primary-ink)}
.sp{margin-top:74px}
.sp-top{display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;padding-top:44px}
.sp-intro b{display:block;font-family:var(--serif);font-size:20px}
.sp-intro span{display:block;color:#cfdaf3;font-size:14px;max-width:520px}
.sp-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-b{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:700 18px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.sp-b:hover{background:rgba(255,255,255,.22)}
.sp-play{font-size:12px}
.sp-dots{display:flex;gap:2px}
.sp-dots button{border:0;background:transparent;width:20px;height:38px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sp-dots i{display:block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.38);transition:.2s}
.sp-dots button[aria-current="true"] i{background:#ffc27a;width:20px;border-radius:6px}
.sp-count{font-size:13px;color:#cfdaf3;min-width:48px;text-align:center}
.sp-bar{height:3px;background:rgba(255,255,255,.14);border-radius:3px;margin-top:16px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;background:#ffc27a;transform-origin:left;animation:spbar 7s linear forwards}
.sp.paused .sp-bar i{animation-play-state:paused}
@keyframes spbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sp .g-top{padding:34px 0 30px}
.sp-main.fx{animation:spin .55s ease both}
@keyframes spin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sp .g-top h2{font-size:clamp(30px,4.2vw,50px)}
.sp-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:26px;padding:22px 24px;margin:0 0 72px}
.sp-cols[hidden],#spDeep[hidden]{display:none}
.sp-cols h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#ffc27a}
.sp-cols ul{margin:0;padding-left:20px;color:#e9effc}.sp-cols li{margin:5px 0}
.nb{display:flex;flex-wrap:wrap;gap:8px}
.nb button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 13px;font:600 13.5px var(--sans);cursor:pointer}
.nb button:hover{background:#fff;color:#16356b}
.sp-trip[aria-pressed="true"]{background:#fff;color:#16356b}
.g-facts b{font-size:16px;line-height:1.25}
.g-facts span{margin-top:3px}
.legend em{font-style:normal}
@media (prefers-reduced-motion:reduce){.sp-main.fx{animation:none}.sp-bar i{animation:none;transform:scaleX(1)}}
@media (max-width:900px){.sp-top{padding-top:34px}}
@media (max-width:560px){
  .top-inner{gap:6px}
  .brand{font-size:17px;gap:7px}
  .brand .logo{width:30px;height:30px}
  .lang button{padding:0 6px;min-width:28px;height:30px;font-size:12px}
  .icon-btn{min-width:36px;height:36px;padding:0 8px}
  .sp-dots button{width:15px}
  .sp-dots button[aria-current="true"] i{width:14px}
}
@media (max-width:420px){
  .top-inner{gap:4px}
  .brand{font-size:15px;gap:5px}
  .brand .logo{width:26px;height:26px}
  .lang{padding:2px}
  .lang button{padding:0 5px;min-width:26px;height:30px;font-size:11.5px}
  .icon-btn{min-width:34px;height:34px;padding:0 6px}
}

</style>
</head>
<body>
<a class="skip" href="#main" data-t="skip"></a>
<div class="concept" id="concept" role="note">
  <span data-t="concept"></span>
  <button type="button" data-act="close-concept" data-ta="dismiss" aria-label="Dismiss notice">×</button>
</div>

<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="#top" aria-label="Armenia Holidays">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#16356b"/><path d="M5 31 14 15l5 8 4-6 12 14z" fill="#fff"/><path d="M11 20.5 14 15l3 4.6z" fill="#e8892b"/><circle cx="29" cy="11" r="3" fill="#e8892b"/></svg>
      <span>Armenia <b>Holidays</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Main navigation">
      <a href="#spot" data-sec="spot" data-t="nav_spot"></a>
      <a href="#explore" data-sec="explore" data-t="nav_explore"></a>
      <a href="#atlas" data-sec="atlas" data-t="nav_atlas"></a>
      <a href="#help" data-sec="help" data-t="nav_help"></a>
      <a href="#plan" data-sec="plan" data-t="nav_plan"></a>
      <a href="#contact" data-sec="contact" data-t="nav_contact"></a>
    </nav>
    <div class="spacer"></div>
    <span class="pill" id="openPill" title="Yerevan time"><i class="dot"></i><span id="openText"></span></span>
    <div class="lang" id="langSw" role="group" data-ta="lang" aria-label="Language">
      <button type="button" data-act="lang" data-id="en" lang="en">EN</button>
      <button type="button" data-act="lang" data-id="ru" lang="ru">RU</button>
      <button type="button" data-act="lang" data-id="hy" lang="hy">ՀԱՅ</button>
    </div>
    <button class="icon-btn" type="button" data-act="go" data-id="plan" data-ta="mytrip" aria-label="My trip">🧳 <span class="badge" id="tripBadge" hidden>0</span></button>
    <button class="icon-btn" id="themeBtn" type="button" data-act="theme" data-ta="dark" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>

<main id="main">
<section class="hero" id="top" aria-labelledby="h1">
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <svg viewBox="0 0 1440 360" preserveAspectRatio="none">
      <path d="M0 360V250l140-40 100 40 130-60 110 60 180-90 140 100 120-40 130 70 110-60 150 70 130-50V360z" fill="#fbf6ee" opacity=".12"/>
      <path d="M380 360 560 130l60 60 70-110 120 190 140-170 160 260z" fill="#fbf6ee" opacity=".2"/>
      <path d="M0 360v-60l120-40 120 40 150-60 130 60 160-40 110 50 130-50 120 50 150-40 150 40V360z" fill="var(--bg)"/>
    </svg>
  </div>
  <div class="wrap hero-inner">
    <span class="eyebrow" data-t="hero_eyebrow"></span>
    <h1 id="h1" data-th="hero_h1"></h1>
    <p class="lead" data-t="hero_lead"></p>
    <div class="search" id="searchBox" role="search">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" role="combobox" aria-expanded="false" aria-controls="panel" aria-autocomplete="list" data-tp="search_ph" autocomplete="off" spellcheck="false" data-ta="search_label" aria-label="Search">
      <div class="right"><span class="kbd" aria-hidden="true">/</span><button class="clear" id="clearBtn" type="button" data-act="clear" aria-label="Clear search">✕</button></div>
      <div class="panel" id="panel" role="listbox" aria-label="Search suggestions" hidden></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="hero-actions">
      <a class="btn accent" href="#spot" data-act="go" data-id="spot" data-t="hero_btn1"></a>
      <a class="btn ghost" href="#atlas" data-act="go" data-id="atlas" data-t="hero_btn2"></a>
      <a class="btn ghost" href="#plan" data-act="go" data-id="plan" data-t="hero_btn3"></a>
    </div>
  </div>
</section>

<div class="wrap trust">
  <div class="stats">
    <div class="stat"><b>1997</b><span data-t="stat1"></span></div>
    <div class="stat"><b>30+</b><span data-t="stat2"></span></div>
    <div class="stat"><b>3</b><span data-t="stat3"></span></div>
    <div class="stat"><b id="statQ">40+</b><span data-t="stat4"></span></div>
  </div>
</div>

<!-- SPOTLIGHT: starts with Garni + Geghard, then rotates through other places, never the same place twice in a row -->
<section class="garni sp" id="spot" aria-roledescription="carousel" data-ta="spot_h2" aria-label="Spotlight">
  <div class="wrap">
    <div class="sp-top">
      <div class="sp-intro"><b data-t="spot_h2"></b><span data-t="spot_sub"></span></div>
      <div class="sp-ctl">
        <button type="button" class="sp-b" data-act="sp-prev" data-ta="spot_prev" aria-label="Previous">‹</button>
        <div class="sp-dots" id="spDots" role="group"></div>
        <button type="button" class="sp-b" data-act="sp-next" data-ta="spot_next" aria-label="Next">›</button>
        <button type="button" class="sp-b sp-play" id="spPlay" data-act="sp-play" aria-label="Pause">❚❚</button>
        <span class="sp-count" id="spCount"></span>
      </div>
    </div>
    <div class="sp-bar" id="spBar" aria-hidden="true"></div>

    <div id="spSlide" role="group" aria-roledescription="slide" aria-live="off">
      <div class="g-top sp-main" id="spMain">
        <div>
          <span class="tagline" id="spTag"></span>
          <h2 id="spotH"></h2>
          <p class="lead" id="spLead"></p>
          <div class="g-facts" id="spFacts"></div>
          <div class="g-btns" id="spBtns"></div>
        </div>
        <div class="g-art art" id="spArt"></div>
      </div>

      <div class="sp-cols" id="spMore" hidden></div>

      <div id="spDeep" hidden>
        <div class="g-tabs" role="tablist" id="gTabs" data-ta="spot_h2"></div>
        <div class="g-panel" id="gPanel" role="tabpanel" aria-live="polite"></div>
        <div class="day">
          <h3 data-t="day_h"></h3>
          <p class="small" data-t="day_sub"></p>
          <ol class="steps">
            <li><b>09:00</b><span data-t="d1"></span></li>
            <li><b>09:50</b><span data-t="d2"></span></li>
            <li><b>11:15</b><span data-t="d3"></span></li>
            <li><b>12:30</b><span data-t="d4"></span></li>
            <li><b>14:00</b><span data-t="d5"></span></li>
            <li><b>16:30</b><span data-t="d6"></span></li>
          </ol>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- EXPLORE -->
<section class="sec wrap" id="explore" aria-labelledby="exH">
  <div class="sec-head">
    <div><span class="kicker" data-t="explore_kicker"></span><h2 id="exH" data-t="explore_h2"></h2><p class="sub"><span data-t="explore_sub"></span> <a href="#atlas" data-act="go" data-id="atlas" data-t="explore_link"></a></p></div>
    <div class="filters" id="filters" role="group"></div>
  </div>
  <div class="grid" id="places"></div>
</section>

<!-- ATLAS -->
<section class="sec wrap" id="atlas" aria-labelledby="atlasH">
  <div class="sec-head">
    <div><span class="kicker" data-t="atlas_kicker"></span><h2 id="atlasH" data-t="atlas_h2"></h2><p class="sub" data-t="atlas_sub"></p></div>
  </div>
  <div class="afilters">
    <div class="filters" id="regChips" role="group"></div>
    <div class="filters" id="typeChips" role="group"></div>

  <div class="sec-head">
    <div><span class="kicker" data-t="help_kicker"></span><h2 id="helpH" data-t="help_h2"></h2><p class="sub" data-t="help_sub"></p></div>
  </div>
  <div class="layout">
    <aside class="side">
      <div class="box"><h3 data-t="topics_h"></h3><div class="topics" id="topics"></div></div>

    </aside>
    <div>
      <div class="ffilter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

      <button class="more" id="moreBtn" type="button" data-act="more" hidden></button>
    </div>
  </div>
</section>

<!-- PLAN -->
<section class="sec wrap" id="plan" aria-labelledby="planH">
  <div class="sec-head"><div><span class="kicker" data-t="plan_kicker"></span><h2 id="planH" data-t="plan_h2"></h2><p class="sub" data-t="plan_sub"></p></div></div>
  <form class="formcard" id="planForm" novalidate>
    <div style="margin-bottom:16px">
      <label data-t="trip_places"></label>
      <div class="trip" id="tripChips"></div>
    </div>
    <div class="grid2">
      <div><label for="p_name" data-t="p_name"></label><input id="p_name" type="text" autocomplete="name"><div class="err" data-for="p_name"></div></div>
      <div><label for="p_email" data-t="p_email"></label><input id="p_email" type="email" autocomplete="email"><div class="err" data-for="p_email"></div></div>
      <div><label for="p_from" data-t="p_from"></label><input id="p_from" type="date"></div>
      <div><label for="p_to" data-t="p_to"></label><input id="p_to" type="date"></div>
      <div><label for="p_adults" data-t="p_adults"></label><input id="p_adults" type="number" min="1" max="99" value="2"></div>
      <div><label for="p_kids" data-t="p_kids"></label><input id="p_kids" type="number" min="0" max="20" value="0"></div>
      <div><label for="p_country" data-t="p_country"></label><input id="p_country" type="text" data-tp="p_country_ph"></div>
      <div><label for="p_hotel" data-t="p_hotel"></label><select id="p_hotel"></select></div>
    </div>
    <fieldset><legend data-t="interests_h"></legend><div class="checks" id="interests"></div></fieldset>
    <label for="p_msg" data-t="p_msg"></label>
    <textarea id="p_msg" data-tp="p_msg_ph"></textarea>
    <div class="row">
      <button class="btn" type="submit" data-t="plan_submit"></button>
      <button class="btn ghost" type="button" id="copyPlan" data-act="copy-plan" data-t="copy_plan"></button>
    </div>
    <div class="success" id="planOk" role="status"></div>
  </form>
</section>

["visa","Do I need a visa to visit Armenia?","Citizens of many countries, including the US, most EU states and Russia, can enter without a visa. Others can usually apply for an e-visa online. Rules change, so check the official portal evisa.mfa.am, and we can confirm the current rule for your passport.","p"],
["visa","How do I apply for an Armenia e-visa?","Apply on the official portal evisa.mfa.am: complete the form, upload a passport scan and photo, pay online and receive the visa by email. Keep a digital or printed copy while traveling.","p"],

["sights","Is Garni worth visiting?","Yes. Garni is the only surviving Greco-Roman colonnaded temple in Armenia, with a Roman bath mosaic and the Symphony of the Stones basalt gorge right beside it. It is the easiest, most photogenic half-day from Yerevan, especially combined with Geghard.","p"],
["sights","How long should I spend at Garni?","Plan 1–1.5 hours for the temple, bath and gorge viewpoint. With Geghard Monastery and a village lunch, a relaxed half-day takes 4–5 hours including the drive from Yerevan."],

["sights","Can I combine Garni, Geghard and a lavash class?","Yes. This is one of our most popular half-days: Garni Temple, the gorge viewpoint, a lavash-baking experience with lunch, then Geghard Monastery. Activities are confirmed in your quotation.","c"],

["sights","How far are Garni and Geghard from Yerevan?","They are roughly 30–40 km east of Yerevan. Allow about 40–60 minutes each way; they are commonly visited together, about 9 km apart.","p"],
["sights","What is Geghard?","Geghard is a medieval monastery partly carved into rock and inscribed as a UNESCO World Heritage Site."],
["sights","What are the top sights in Yerevan?","Republic Square, the Cascade, Matenadaran, Tsitsernakaberd Memorial, Erebuni Fortress and Vernissage Market are among the most popular.","p"],

["Որքա՞ն ժամանակ պետք է Գառնիում","Նախատեսեք 1–1,5 ժամ տաճարի, բաղնիքի և կիրճի դիտահարթակի համար։ Գեղարդի վանքի և գյուղական ճաշի հետ հանգիստ կես օրը տևում է 4–5 ժամ՝ Երևանից ճանապարհը ներառյալ։"],
["Ի՞նչ է «Քարերի սիմֆոնիան»","Գառնու տակ Ազատ գետի կիրճի հատված, որտեղ բազալտը ձևավորել է երգեհոնի խողովակների նման բարձր վեցանիստ սյուներ։ Երևանի մոտ ամենաշատ լուսանկարվող բնական տեսարժան վայրերից մեկն է։"],
["Կարո՞ղ եմ համադրել Գառնին, Գեղարդը և լավաշի դասընթացը","Այո։ Սա մեր ամենահայտնի կես օրերից մեկն է՝ Գառնու տաճար, կիրճի դիտահարթակ, լավաշ թխելու փորձ ճաշի հետ, ապա Գեղարդի վանք։ Միջոցառումները հաստատվում են ձեր առաջարկում։"],
["Հարմա՞ր է Գառնին երեխաների և տարեց ճանապարհորդների համար","Հիմնականում՝ այո։ Տաճարի տարածքով կարելի է քայլել, բայց կան աստիճաններ և անհարթ քար։ Հայտնեք մեզ տեղաշարժի կարիքների մասին, և մենք կմտածենք ժամանակի, կայանատեղի և ամենահեշտ դիտակետերի մասին։"],
["Տոմսե՞ր են պետք Գառնի և Գեղարդ այցելելու համար","Երկու վայրերում էլ կարող է մուտքի վճար լինել։ Ձեր առաջարկում նշված է՝ ինչն է ներառված և ինչը վճարում եք տեղում։"],
["Որքա՞ն հեռու են Գառնին և Գեղարդը Երևանից","Երևանից մոտ 30–40 կմ դեպի արևելք։ Նախատեսեք մեկ ուղղությամբ 40–60 րոպե․ դրանք սովորաբար այցելում են միասին, միմյանցից մոտ 9 կմ հեռավորության վրա։"],
["Ի՞նչ է Գեղարդը","Գեղարդը միջնադարյան վանք է, մասամբ փորագրված ժայռի մեջ և ընդգրկված ՅՈՒՆԵՍԿՕ-ի Համաշխարհային ժառանգության ցանկում։"],
["Որո՞նք են Երևանի գլխավոր տեսարժան վայրերը","Հանրապետության հրապարակ, Կասկադ, Մատենադարան, Ծիծեռնակաբերդի հուշահամալիր, Էրեբունի ամրոց և Վերնիսաժի շուկա՝ ամենահայտնիներից են։"],
["Կարելի՞ է տեսնել Արարատ լեռը","Այո, պարզ օրերին այն երևում է Երևանից, հատկապես՝ Խոր Վիրապից։ Արարատ լեռը գտնվում է Թուրքիայում և երևում է Հայաստանից։"],
["Որքա՞ն հեռու է Սևանա լիճը","Սևանա լիճը Երևանից մոտ 60 կմ հեռավորության վրա է, սովորաբար մեքենայով մոտ մեկ ժամ։ Ծովի մակարդակից մոտ 1900 մ բարձրության վրա այն ավելի զով է, քան մայրաքաղաքը։"],
["Ե՞րբ է լավագույնը այցելել Հայաստան","Գարունը՝ հատկապես ապրիլ–հունիսը, և աշունը՝ հատկապես սեպտեմբեր–հոկտեմբերը, հիանալի են տեսարժան վայրերի համար։ Ամռանը Երևանում շոգ է, բայց լեռներում ավելի զով է․ ձմռանը՝ դահուկներ և քաղաքային հանգիստ։"],
["Քանի՞ օր է պետք","Չորս–հինգ օրը բավական է Երևանի և մոտակա վայրերի համար՝ Գառնին և Գեղարդն ներառյալ։ Մեկ շաբաթը կավելացնի Սևանա լիճը, Դիլիջանը և հարավը։ Տասն օրը և ավելին թույլ են տալիս ավելի լիարժեք երթուղի կամ Հայաստան–Վրաստան համադրություն։"],
["Ի՞նչ վերցնել ճանապարհորդության","Վերցրեք քայլելու հարմար կոշիկներ, շերտավոր հագուստ՝ լեռների փոփոխվող եղանակի համար, արևապաշտպանություն ամռանը և տաք վերնազգեստ բարձրադիր վայրերի համար։ Եկեղեցիներ այցելելու համար պետք է համեստ հագուստ։"],
["Հարմա՞ր է Հայաստանն առաջին այցելության համար","Այո։ Հեռավորությունները կարճ են, հիմնական տեսարժան վայրերը հասանելի են Երևանից, իսկ անգլերենն ու ռուսերենը լայնորեն հասկացվում են զբոսաշրջության ոլորտում։"],
["Կարո՞ղ եք կազմել անհատական երթուղի","Այո։ Մենք երթուղիներ ենք կառուցում պատմության, սննդի, գինու, արշավների, լուսանկարչության, ընտանեկան կամ գործնական ճանապարհորդությունների շուրջ։"],
["Հարմա՞ր է Հայաստանը ընտանիքների համար","Այո։ Խորհուրդ ենք տալիս կարճ երթուղիներ, պարբերական կանգառներ և մշակութային վայրերի համադրություն այնպիսի միջոցառումների հետ, ինչպիսիք են Տաթևի ճոպանուղին կամ գյուղական փորձառությունները։"],
["Ի՞նչ տուրեր եք առաջարկում","Դասական մշակութային տուրեր, գաստրոնոմիական և գինու ուղևորություններ, լուսանկարչական երթուղիներ, արշավներ և ջիպ արկածներ, ինչպես նաև համադրություններ Վրաստանի և Իրանի հետ։"],
["Որո՞նք են Երևանից տիպիկ մեկօրյա ուղևորությունները","Հայտնի են՝ Գառնի Գեղարդի վանքի հետ, Խոր Վիրապ Նորավանքի և Արենիի հետ, կամ Սևանա լիճ Դիլիջանի հետ։"],
["Տուրերում ներառվա՞ծ է ուղեկցորդը","Ուղեկցորդով տուրերում ներառված է տեղական ուղեկցորդ։ Ձեր առաջարկում հստակ նշված է՝ ինչն է ներառված և ինչը՝ ոչ։"],
["Կա՞ն արշավային տուրեր","Այո՝ հեշտ հովտային զբոսանքներից մինչև ավելի բարդ լեռնային երթուղիներ։ Ասեք ձեր պատրաստվածության մակարդակը և ճանապարհորդության սեզոնը, և մենք կառաջարկենք հարմար արահետ։"],
["Ինչպե՞ս հասնել «Զվարթնոց» օդանավակայանից քաղաք","Օդանավակայանը Երևանի կենտրոնից մոտ 10 կմ հեռավորության վրա է։ Մասնավոր տրանսֆերը սովորաբար տևում է 20–30 րոպե՝ կախված երթևեկությունից։"],
["Առաջարկո՞ւմ եք մասնավոր տրանսֆերներ","Այո։ Օդանավակայանի տրանսֆերները, միջքաղաքային տրանսֆերները և վարորդով մեքենաները կարելի է ավելացնել ցանկացած երթուղու։"],
["Կարո՞ղ եմ մեքենա վարձակալել","Այո։ Armenia Holidays-ը Հայաստանում Hertz-ի պաշտոնական ներկայացուցիչն է։"],
["Ի՞նչ է պետք մեքենա վարձակալելու համար","Սովորաբար՝ վավեր վարորդական իրավունք, անձնագիր և վճարային քարտ՝ գրավի համար։ Տարիքի, փորձի և միջազգային իրավունքի պահանջները կախված են վարձակալության պայմաններից։"],
["Դժվա՞ր է Հայաստանում մեքենա վարելը","Քաղաքային երթևեկությունը կարող է խիտ լինել, իսկ լեռնային ճանապարհները՝ ոլորապտույտ։ Շատերը երկար կամ հեռավոր երթուղիների համար ընտրում են վարորդ։"],
["Կարո՞ղ եք հյուրանոցներ ամրագրել","Այո։ Հյուրանոցների ամրագրումը մեր ծառայությունների մաս է՝ Երևանի հյուրանոցներից մինչև մարզային հյուրատներ և լեռնային տնակներ։"],
["Որտե՞ղ է լավ կանգնել Երևանում","Հանրապետության հրապարակի և Հյուսիսային պողոտայի շրջակայքը հարմար է թանգարանների, ռեստորանների, Կասկադի և քայլարշավների համար։"],
["Ի՞նչ արժույթ է օգտագործվում Հայաստանում","Հայկական դրամը՝ AMD կրճատմամբ, գրվում է ֏ նշանով։"],
["Կարո՞ղ եմ վճարել քարտով","Քարտերը լայնորեն ընդունվում են Երևանի հյուրանոցներում, ռեստորաններում և խանութներում։ Գյուղական վայրերի և մանր գնումների համար վերցրեք որոշ կանխիկ գումար։"],
["Որքա՞ն թեյավճար թողնել","Ռեստորաններում ընդունված է մոտ 10%, եթե սպասարկումը չի ներառվել։ Ուղեկցորդների և վարորդների թեյավճարները գնահատվում են։"],
["Ի՞նչ խրոցակներ և լարում են օգտագործվում","Հայաստանում լարումը 220–230 Վ է՝ 50 Հց, եվրոպական C և F տիպի խրոցակներով։"],
["Անվտա՞նգ է ծորակի ջուրը","Երևանում ծորակի ջուրը լայնորեն խմում են տեղացիները։ Գյուղական շրջաններում զգայուն ստամոքսի համար ավելի անվտանգ է շշալցված ջուրը։"],
["Ո՞ր համարով զանգել արտակարգ իրավիճակում","Զանգահարեք 112՝ Հայաստանի արտակարգ ծառայությունների համար։"],

const A={reg:"all",type:"all",shown:12};

function atlasItems(){

  return ALL.filter(p=>(A.reg==="all"||p.reg===A.reg)&&(A.type==="all"||p.t===A.type))
    .sort((a,b)=>order.indexOf(a.reg)-order.indexOf(b.reg)||(b.feat?1:0)-(a.feat?1:0)||nm(a).localeCompare(nm(b),loc));
}
function syncMap(fit){
  if(!map)return;
  layer.clearLayers();
  const list=atlasItems();
  list.forEach(p=>{
    const m=L_.marker(p.ll,{icon:L_.divIcon({className:"pinw",html:'<span class="pin '+(p.feat?"feat":p.t)+'"></span>',iconSize:[22,22],iconAnchor:[11,11]}),title:nm(p),alt:nm(p),keyboard:true});
    m.bindTooltip(nm(p),{direction:"top",offset:[0,-8]});
    m.on("click",()=>openPlace(p.id));
    m.addTo(layer);
  });
  if(fit&&list.length)map.fitBounds(L_.latLngBounds(list.map(p=>p.ll)),{padding:[36,36],maxZoom:list.length===1?11:10});
}
let L_=null; /* Leaflet, assigned when loaded (L is the language here) */
function mapFail(){const b=$("#map");mapState="failed";b.classList.add("nomap");b.innerHTML="<p>"+esc(t("map_fail"))+"</p>"}
function startMap(){
  if(map||mapState==="loading")return;
  const init=()=>{
    try{
      L_=window.L;
      map=L_.map("map",{scrollWheelZoom:false}).setView([40.25,44.9],8);
      L_.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"© OpenStreetMap contributors"}).addTo(map);
      layer=L_.layerGroup().addTo(map);
      map.on("click",()=>map.scrollWheelZoom.enable());
      map.on("mouseout",()=>map.scrollWheelZoom.disable());
      mapState="ready";syncMap(true);
    }catch(e){mapFail()}
  };
  if(window.L&&window.L.map){init();return}
  mapState="loading";
  const css=document.createElement("link");css.rel="stylesheet";css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css";document.head.appendChild(css);
  const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";
  s.onload=()=>{mapState="idle";init()};s.onerror=mapFail;document.head.appendChild(s);
}

function renderTopics(){
  const b=$("#topics"),counts={all:FAQ.length};FAQ.forEach(f=>counts[f.t]=(counts[f.t]||0)+1);
  const add=(k,l)=>`<button class="topic" type="button" data-act="topic" data-id="${k}" aria-pressed="${state.topic===k}"><span>${esc(l)}</span><span class="n">${counts[k]||0}</span></button>`;
  b.innerHTML=add("all",t("topic_all"))+TOPIC_KEYS.map(k=>add(k,t("tp_"+k))).join("");
  $("#popular").innerHTML=FAQ.filter(f=>f.p).slice(0,6).map(f=>`<button type="button" data-act="faq" data-id="${f.id}">${esc(fq(f).q)}</button>`).join("");
}
function filtered(){
  let list=FAQ.filter(f=>state.topic==="all"||f.t===state.topic);
  if(!tokens(state.query).length)return{items:list,toks:[],mode:"all"};
  const r=search(state.query,["faq"]),set=new Set(list.map(f=>f.id));
  return{items:r.items.map(d=>FBYID[d.id]).filter(f=>set.has(f.id)),toks:r.toks,mode:r.mode};
}
function renderFaq(){
  const res=filtered(),bx=$("#faq");
  $("#listTitle").textContent=state.query?t("list_res",state.query):(state.topic==="all"?t("list_all"):t("tp_"+state.topic));
  $("#listCount").textContent=t(res.items.length===1?"ans_one":"ans_many",res.items.length)+(res.mode==="or"&&state.query?t("closest"):"");
  const mp=state.query?search(state.query,["place"]).items.slice(0,3):[];
  $("#mplaces").innerHTML=mp.map(d=>{const p=PBYID[d.id];return `<button class="mp" type="button" data-act="place" data-id="${p.id}"><span class="art">${art(p.id,p.scene,nm(p))}</span>${esc(nm(p))}</button>`}).join("");
  if(!res.items.length){
    bx.innerHTML=`<div class="noresult"><h3>${t("nores_h")}</h3><p>${t("nores_p")}</p><button class="btn" type="button" data-act="go" data-id="contact">${t("contact_us")}</button></div>`;
    $("#moreBtn").hidden=true;return;
  }
  let vis=res.items.slice(0,state.shown);
  if(state.open&&!vis.some(f=>f.id===state.open)){const i=res.items.findIndex(f=>f.id===state.open);if(i>=0)vis=res.items.slice(0,Math.max(state.shown,i+1))}
  const votes=store("ah_votes")||{};
  bx.innerHTML=vis.map(f=>{
    const open=state.open===f.id,c=fq(f);
    return `<div class="item${open?" open":""}" id="faq-${f.id}"><button class="q" type="button" data-act="toggle" data-id="${f.id}" aria-expanded="${open}" aria-controls="ans-${f.id}"><span class="tag">${esc(t("tp_"+f.t))}</span><span class="t">${hl(c.q,res.toks)}</span><span class="chev" aria-hidden="true">▾</span></button>
     <div class="a" id="ans-${f.id}" role="region"${open?"":" hidden"}><p>${hl(c.a,res.toks)}</p>
     <div class="meta2"><span>${t("helpful")}</span><button type="button" data-act="vote" data-id="${f.id}" data-v="1" aria-pressed="${votes[f.id]===1}">${t("yes")}</button><button type="button" data-act="vote" data-id="${f.id}" data-v="-1" aria-pressed="${votes[f.id]===-1}">${t("no")}</button><button type="button" data-act="copy" data-id="${f.id}">${t("copylink")}</button>${f.c?`<span>${t("confirm")}</span>`:""}</div></div></div>`;
  }).join("");
  const left=res.items.length-vis.length,more=$("#moreBtn");
  more.hidden=left<=0;more.textContent=t("more",Math.min(left,CONFIG.pageSize),left);
}
function openFaq(id){
  if(!FBYID[id])return;
  if(!filtered().items.some(f=>f.id===id)){state.topic="all";state.query="";$("#faqFilter").value=""}
  state.open=id;renderTopics();renderFaq();
  const n=$("#faq-"+id);
  if(n){n.classList.add("target");setTimeout(()=>n.classList.remove("target"),1700);n.scrollIntoView({behavior:"smooth",block:"center"})}
  try{history.replaceState(null,"","#faq-"+id)}catch(e){}
}
$("#faqFilter").addEventListener("input",function(){
  clearTimeout(this.t);this.t=setTimeout(()=>{state.query=this.value.trim();state.shown=CONFIG.pageSize;state.open=null;renderFaq()},120);
});

/* ===== hours ===== */
function dayName(d){const s=new Date(2024,0,7+d).toLocaleDateString(LOCALE[L],{weekday:"long"});return s.charAt(0).toUpperCase()+s.slice(1)}
const hoursLabel=()=>t("hours_fmt",CONFIG.hours.open,CONFIG.hours.close);
function renderHours(){
  $("#hours").innerHTML=[1,2,3,4,5,6,0].map(d=>`<div><span>${esc(dayName(d))}</span><b>${CONFIG.hours.days.includes(d)?CONFIG.hours.open+" – "+CONFIG.hours.close:t("closed")}</b></div>`).join("");
}
function hm(s){const[a,b]=s.split(":");return +a*60+ +b}
function renderOpen(){
  const pill=$("#openPill"),el_=$("#openText");
  try{
    const parts=new Intl.DateTimeFormat("en-US",{timeZone:CONFIG.timezone,weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()),m={};
    parts.forEach(x=>m[x.type]=x.value);
    const day={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[m.weekday],min=(+m.hour%24)*60+ +m.minute;
    const open=CONFIG.hours.days.includes(day)&&min>=hm(CONFIG.hours.open)&&min<hm(CONFIG.hours.close);
    pill.classList.toggle("open",open);
    el_.textContent=open?t("open_now",CONFIG.hours.close):t("closed_now",hoursLabel());
  }catch(e){el_.textContent=hoursLabel()}
}

/* ===== navigation ===== */
function scrollToId(id){const n=document.getElementById(id);if(n)n.scrollIntoView({behavior:"smooth",block:"start"})}
const secObs=("IntersectionObserver" in window)?new IntersectionObserver(es=>{
  es.forEach(en=>{if(en.isIntersecting)$$("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.sec===en.target.id))});
},{rootMargin:"-45% 0px -50% 0px"}):null;
if(secObs)["spot","explore","atlas","help","plan","contact"].forEach(id=>secObs.observe(document.getElementById(id)));

/* ===== forms ===== */
const mailto=(s,b)=>"mailto:"+CONFIG.email+"?subject="+encodeURIComponent(s)+"&body="+encodeURIComponent(b);
/* the request goes to the team, so its text is always English (plus the visitor's language) */
function planText(){
  const places=[...trip].map(i=>PBYID[i].name).join(", ")||"—";
  const ints=$$("#interests input:checked").map(i=>tEn("int"+i.value)).join(", ")||"—";
  return["Trip request","Name: "+$("#p_name").value.trim(),"Email: "+$("#p_email").value.trim(),
   "Visitor language: "+L.toUpperCase(),
   "Dates: "+($("#p_from").value||"flexible")+" → "+($("#p_to").value||"flexible"),
   "Travelers: "+$("#p_adults").value+" adults, "+$("#p_kids").value+" children",
   "Passport country: "+($("#p_country").value.trim()||"—"),"Hotel level: "+tEn("hotel"+$("#p_hotel").value),
   "Places: "+places,"Interests: "+ints,"","Message:",$("#p_msg").value.trim()||"—"].join("\n");
}
function setErr(id,msg){const e=$('.err[data-for="'+id+'"]');if(e)e.textContent=msg||""}

function renderForms(){
  const checked=new Set($$("#interests input:checked").map(i=>i.value));
  $("#interests").innerHTML=Array.from({length:10},(_,i)=>`<label><input type="checkbox" value="${i}"${checked.has(String(i))?" checked":""}><span>${esc(t("int"+i))}</span></label>`).join("");
  const h=$("#p_hotel"),hv=h.value||"2";
  h.innerHTML=[1,2,3,4].map(i=>`<option value="${i}">${esc(t("hotel"+i))}</option>`).join("");h.value=hv;
  const m=$("#m_topic"),mv=m.value;
  m.innerHTML=`<option value="">${esc(t("m_topic_ph"))}</option>`+Array.from({length:7},(_,i)=>`<option value="${i+1}">${esc(t("mt"+(i+1)))}</option>`).join("");m.value=mv;
  ["p_name","p_email","m_name","m_email","m_topic","m_msg"].forEach(i=>setErr(i));
  $("#planOk").classList.remove("on");$("#msgOk").classList.remove("on");
}
function renderContact(){
  const phoneHref="tel:"+CONFIG.phone.replace(/[^\d+]/g,"");
  let cl=`<div class="box"><b>${t("c_phone")}</b><a class="value" href="${esc(phoneHref)}">${esc(CONFIG.phone)}</a></div><div class="box"><b>${t("c_email")}</b><a class="value" href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a></div><div class="box"><b>${t("c_office")}</b><span class="value">${esc(CONFIG.address||t("address"))}</span></div><div class="box"><b>${t("c_hours")}</b><span class="value">${esc(hoursLabel())} ${t("yerevan_time")}</span></div>`;
  if(CONFIG.whatsapp)cl+=`<div class="box"><b>${t("c_wa")}</b><a class="value" href="https://wa.me/${esc(CONFIG.whatsapp)}">${t("chat_us")}</a></div>`;
  if(CONFIG.telegram)cl+=`<div class="box"><b>${t("c_tg")}</b><a class="value" href="https://t.me/${esc(CONFIG.telegram)}">@${esc(CONFIG.telegram)}</a></div>`;
  $("#contactList").innerHTML=cl;
}
let ldEl=null;
function renderLd(){
  if(!ldEl){ldEl=document.createElement("script");ldEl.type="application/ld+json";document.head.appendChild(ldEl)}
  ldEl.textContent=JSON.stringify({"@context":"https://schema.org","@type":"FAQPage",inLanguage:L,mainEntity:FAQ.filter(f=>f.p).slice(0,12).map(f=>{const c=fq(f);return{"@type":"Question",name:c.q,acceptedAnswer:{"@type":"Answer",text:c.a}}})});
}

function setup(){
  $("#year").textContent=new Date().getFullYear();
  $("#salesMail").href=mailto("Armenia Holidays website concept","Hello, I'd like to discuss the website concept.");
  // Form submission is intentionally disabled; the rest of the page remains unchanged.
  $("#planForm").addEventListener("submit",e=>e.preventDefault());
  $("#msgForm").addEventListener("submit",e=>e.preventDefault());
}

/* ===== language switch: re-render everything that holds text ===== */
function renderAll(){
  applyStatic();
  $("#statQ").textContent=FAQ.length+"+";
  $("#chips").innerHTML=CHIPS[L].map(w=>`<button class="chip" type="button" data-act="q" data-v="${esc(w)}">${esc(w)}</button>`).join("");
  renderForms();renderContact();renderFilters();renderPlaces();renderTopics();renderFaq();renderHours();renderOpen();renderTrip();renderAtlas(false);renderSpot(false);renderLd();
  if(!panel.hidden)renderPanel();
  if(dlg.open&&dlgId)openPlace(dlgId);
}
function setLang(l){
  if(!LANGS.includes(l)||l===L)return;
  L=l;store("ah_lang",l);renderAll();
}

/* ===== one delegated click handler (every clickable has data-act) ===== */
document.addEventListener("click",e=>{
  const el_=e.target.closest("[data-act]");if(!el_)return;
  const a=el_.dataset.act,id=el_.dataset.id,tt=el_;
  switch(a){
   case "go":e.preventDefault();scrollToId(id);break;
   case "close-concept":$("#concept").hidden=true;break;
   case "theme":{const th=document.documentElement.dataset.theme==="dark"?"light":"dark";applyTheme(th);store("ah_theme",th);break}
   case "lang":setLang(id);break;
   case "clear":input.value="";box.classList.remove("has");input.focus();openPanel();break;
   case "q":input.value=tt.dataset.v;box.classList.add("has");scrollTo({top:0,behavior:"smooth"});input.focus();openPanel();break;
   case "place":if(tt.classList.contains("pc")&&e.target.closest(".addbtn"))break;openPlace(id);break;
   case "trip":e.stopPropagation();toggleTrip(id);break;
   case "close-dlg":dlg.close();break;
   case "plan-from":if(!trip.has(id)){trip.add(id);store("ah_trip",[...trip]);renderTrip()}dlg.close();scrollToId("plan");break;
   case "garni-plan":{
     trip.add("garni");trip.add("geghard");store("ah_trip",[...trip]);renderTrip();
     $$("#interests input").forEach(i=>{if(["0","2","3"].includes(i.value))i.checked=true});
     if(!$("#p_msg").value.trim())$("#p_msg").value=t("msg_garni");
     scrollToId("plan");toast(t("t_garni"));break}
   case "sp-prev":spNext(-1);break;
   case "sp-next":spNext(1);break;
   case "sp-go":spGo(+id);break;
   case "sp-play":SP.playing=!SP.playing;spState();break;
   case "spot-region":A.reg=id;A.type="all";A.shown=12;renderAtlas(true);scrollToId("atlas");break;
   case "areg":A.reg=id;A.shown=12;renderAtlas(true);break;
   case "atype":A.type=id;A.shown=12;renderAtlas(true);break;
   case "amore":A.shown+=12;renderAtlas(false);break;
   case "filter":state.filter=id;renderFilters();renderPlaces();break;
   case "gtab":state.tab=id;renderGarniDeep();$("#gt-"+id).focus();break;
   case "topic":e.preventDefault();state.topic=id;state.query="";$("#faqFilter").value="";state.shown=CONFIG.pageSize;state.open=null;renderTopics();renderFaq();if(tt.closest("footer"))scrollToId("help");break;
   case "faq":if(dlg.open)dlg.close();openFaq(+id);break;
   case "toggle":state.open=state.open===+id?null:+id;renderFaq();break;
   case "more":state.shown+=CONFIG.pageSize;renderFaq();break;
   case "vote":{const v=+tt.dataset.v,votes=store("ah_votes")||{};votes[id]=votes[id]===v?0:v;store("ah_votes",votes);
     $$('[data-act="vote"][data-id="'+id+'"]').forEach(b=>b.setAttribute("aria-pressed",String(votes[id]===+b.dataset.v)));
     toast(votes[id]?t("t_thanks"):t("t_fb_removed"));break}
   case "copy":{const link=location.href.split("#")[0]+"#faq-"+id;
     (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast(t("t_copied"))).catch(()=>toast(t("t_nocopy")));break}
   case "copy-plan":
     (navigator.clipboard?navigator.clipboard.writeText(planText()):Promise.reject()).then(()=>toast(t("t_plan_copied"))).catch(()=>toast(t("t_nocopy")));break;
  }
});
addEventListener("hashchange",()=>{const m=location.hash.match(/^#faq-(\d+)$/);if(m)openFaq(+m[1])});

function applyTheme(th){document.documentElement.dataset.theme=th;$("#themeBtn").textContent=th==="dark"?"☀️":"🌙"}
applyTheme(store("ah_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
setup();renderAll();
spGo(0);  /* always opens on Garni + Geghard */
setInterval(renderOpen,60000);
const hm0=location.hash.match(/^#faq-(\d+)$/);if(hm0)openFaq(+hm0[1]);
window.__AHC={search,FAQ,PLACES,state,CONFIG,SP,SPOT,setLang,spGo,get lang(){return L}};

})();
</script>
</body>
